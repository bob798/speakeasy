services:
  app:
    image: ${APP_IMAGE:-speakeasy:local}
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:8600:8000"
    volumes:
      - speakeasy_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  speakeasy_data:
