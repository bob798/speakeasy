services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - speakeasy_data:/data
    networks:
      - speakeasy_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - speakeasy_net
    depends_on:
      app:
        condition: service_healthy

volumes:
  speakeasy_data:
  caddy_data:
  caddy_config:

networks:
  speakeasy_net:
