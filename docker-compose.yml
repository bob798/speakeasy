services:
  dev-web:
    image: ${APP_IMAGE:-speakeasy:local}
    container_name: speakeasy
    env_file: .env.production
    restart: always
    networks:
      - liboboa
    environment:
      TZ: Asia/Shanghai
      # SQLite 落到挂载卷 · 容器重启/镜像更新数据不丢
      DATABASE_URL: sqlite+aiosqlite:////app/data/speakeasy.db
      SPEAKEASY_DB_PATH: /app/data/speakeasy.db
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - logs:/app/logs
      - data:/app/data
    ports:
      - "8600:8000"

volumes:
  logs:
  data:

networks:
  liboboa:
    name: liboboa
    external: true
