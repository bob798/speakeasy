<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Speakeasy - 翻译</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button { cursor: pointer; font-family: inherit; border: none; background: none; }
textarea, input { font-family: inherit; }

:root {
  --bg:        #ede8de;
  --surface:   #e4ddd2;
  --elevated:  #ffffff;
  --overlay:   #f7f4ef;
  --border:       rgba(0,0,0,0.08);
  --border-hover: rgba(0,0,0,0.16);
  --accent:      #3d6b4f;
  --accent-light:#4e8963;
  --accent-dim:  rgba(61,107,79,0.1);
  --rec:     #c0392b;
  --rec-dim: rgba(192,57,43,0.1);
  --text-1: #2c2820;
  --text-2: #7a7060;
  --text-3: #b5aa9a;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
}

body { font-family:'Sora','PingFang SC','Noto Sans SC',system-ui,sans-serif; background:var(--bg); color:var(--text-1); min-height:100vh; }

/* ── Header ── */
.header { display:flex; align-items:center; justify-content:space-between; padding:10px 20px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
.header-left { display:flex; align-items:center; gap:12px; }
.header-left .brand { font-size:16px; font-weight:600; color:var(--text-1); text-decoration:none; }
.header-right { display:flex; align-items:center; gap:8px; }
.header-right a { font-size:18px; text-decoration:none; padding:2px 4px; color:var(--text-2); transition:color 0.15s; }
.header-right a:hover { color:var(--text-1); }

/* ── Container ── */
.container { max-width:1280px; margin:0 auto; padding:20px 16px; }

/* ── Dual Column ── */
.dual-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
@media (max-width: 900px) { .dual-grid { grid-template-columns:1fr; } }

/* ── Card ── */
.card { background:var(--elevated); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; }
.card-title { font-size:14px; font-weight:600; color:var(--text-1); margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.card-title .badge { font-size:11px; font-weight:500; padding:2px 8px; border-radius:10px; background:var(--accent-dim); color:var(--accent); }

/* ── Input / Result Areas ── */
.area { position:relative; }
.area-label { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.area-label-text { font-size:12px; font-weight:600; color:var(--text-2); }
.area-actions { display:flex; gap:6px; }
.area textarea {
  width:100%; min-height:120px; padding:12px 14px;
  border:1px solid var(--border); border-radius:8px; font-size:14px; line-height:1.6;
  resize:vertical; outline:none; transition:border-color 0.15s; background:var(--overlay);
  color:var(--text-1);
}
.area textarea:focus { border-color:var(--accent); }
.area textarea.over-limit { border-color:var(--rec); }
.char-count { font-size:11px; color:var(--text-3); text-align:right; margin-top:4px; transition:color 0.15s; }
.char-count.over { color:var(--rec); font-weight:500; }
.char-limit-msg { font-size:12px; color:var(--rec); margin-top:4px; display:none; }
.char-limit-msg.show { display:block; }

/* ── Action Row ── */
.action-row { display:flex; gap:8px; align-items:center; margin:10px 0; }
.btn { padding:7px 16px; border-radius:8px; font-size:13px; font-weight:500; transition:all 0.15s; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:var(--accent-light); }
.btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
.btn-outline { border:1px solid var(--border); color:var(--text-2); background:var(--elevated); }
.btn-outline:hover { border-color:var(--accent); color:var(--accent); }
.btn-outline:disabled { opacity:0.4; cursor:not-allowed; }
.btn-icon { padding:5px 9px; border-radius:6px; font-size:14px; border:1px solid var(--border); color:var(--text-2); background:var(--elevated); transition:all 0.15s; }
.btn-icon:hover { border-color:var(--accent); color:var(--accent); }
.btn-icon:disabled { opacity:0.4; cursor:not-allowed; }
.spacer { flex:1; }

/* ── Result Box ── */
.result-box {
  min-height:100px; padding:12px 14px;
  background:var(--overlay); border-radius:8px;
  font-size:14px; line-height:1.7; color:var(--text-1);
  white-space:pre-wrap; word-break:break-word;
}
.result-box.placeholder { color:var(--text-3); font-style:italic; }
.result-box.error { color:var(--rec); background:var(--rec-dim); }
.result-box.loading { color:var(--text-3); }

/* ── Vocabulary Panel ── */
.vocab-toggle { display:flex; align-items:center; gap:6px; cursor:pointer; padding:8px 12px; border-radius:8px; background:var(--overlay); border:1px solid var(--border); font-size:13px; color:var(--text-2); transition:all 0.15s; width:fit-content; }
.vocab-toggle:hover { border-color:var(--accent); color:var(--accent); }
.vocab-count { background:var(--accent); color:#fff; font-size:11px; min-width:18px; height:18px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; padding:0 5px; }
.vocab-panel { display:none; margin-top:12px; }
.vocab-panel.show { display:block; }
.vocab-empty { text-align:center; padding:24px; color:var(--text-3); font-size:13px; }
.vocab-item {
  display:flex; align-items:flex-start; gap:10px;
  padding:10px 12px; margin:4px 0; border-radius:8px;
  background:var(--overlay); transition:background 0.15s;
}
.vocab-item:hover { background:var(--accent-dim); }
.vocab-content { flex:1; min-width:0; }
.vocab-source { font-size:13px; font-weight:500; color:var(--text-1); white-space:pre-wrap; word-break:break-word; }
.vocab-translated { font-size:12px; color:var(--text-2); margin-top:2px; white-space:pre-wrap; word-break:break-word; }
.vocab-meta { font-size:11px; color:var(--text-3); margin-top:4px; }
.vocab-del { padding:4px 8px; font-size:12px; color:var(--text-3); border-radius:6px; transition:all 0.15s; flex-shrink:0; }
.vocab-del:hover { color:var(--rec); background:var(--rec-dim); }

/* ── Toast ── */
.toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--text-1); color:#fff; padding:10px 20px; border-radius:8px;
  font-size:13px; opacity:0; transition:all 0.25s; pointer-events:none; z-index:999;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast.success { background:var(--accent); }
.toast.error { background:var(--rec); }

/* ── Loading Spinner ── */
.spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%; animation:spin 0.6s linear infinite; vertical-align:middle; margin-right:4px; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <a href="/" class="brand">🗣️ Speakeasy</a>
    <span style="font-size:13px; color:var(--text-3);">/ 翻译</span>
  </div>
  <div class="header-right">
    <a href="/" title="首页">🏠</a>
    <a href="/practice" title="发音练习">🎙️</a>
    <a href="/memory" title="记忆管理">🧠</a>
  </div>
</header>

<div class="container">

  <!-- Dual-pane translate grid -->
  <div class="dual-grid">

    <!-- ─── Left: zh → en ──────────────────────────────── -->
    <div class="card" data-dir="zh2en">
      <div class="card-title">中 → 英 <span class="badge">zh2en</span></div>

      <div class="area">
        <div class="area-label">
          <span class="area-label-text">输入中文</span>
          <div class="area-actions">
            <button class="btn-icon" data-act="copy-src" title="复制原文">📋</button>
          </div>
        </div>
        <textarea data-el="input" placeholder="输入中文，支持多行（每行独立翻译）…"></textarea>
        <div class="char-count" data-el="char-count">0 / 1000</div>
        <div class="char-limit-msg" data-el="char-limit-msg">⚠️ 输入超过 1000 字符，请缩短后再翻译</div>
      </div>

      <div class="action-row">
        <button class="btn btn-primary" data-act="translate">翻译</button>
        <button class="btn btn-outline" data-act="clear">清除</button>
      </div>

      <div class="area">
        <div class="area-label">
          <span class="area-label-text">译文（英）</span>
          <div class="area-actions">
            <button class="btn-icon" data-act="copy-result" title="复制译文">📋</button>
            <button class="btn-icon" data-act="tts" title="朗读译文">🔊</button>
            <button class="btn-icon" data-act="save" title="收藏到生词本">⭐</button>
          </div>
        </div>
        <div class="result-box placeholder" data-el="result">翻译结果将显示在这里</div>
      </div>
    </div>

    <!-- ─── Right: en → zh ──────────────────────────────── -->
    <div class="card" data-dir="en2zh">
      <div class="card-title">英 → 中 <span class="badge">en2zh</span></div>

      <div class="area">
        <div class="area-label">
          <span class="area-label-text">Enter English</span>
          <div class="area-actions">
            <button class="btn-icon" data-act="copy-src" title="Copy source">📋</button>
          </div>
        </div>
        <textarea data-el="input" placeholder="Enter English text. Multiple lines are translated independently…"></textarea>
        <div class="char-count" data-el="char-count">0 / 1000</div>
        <div class="char-limit-msg" data-el="char-limit-msg">⚠️ Input exceeds 1000 characters</div>
      </div>

      <div class="action-row">
        <button class="btn btn-primary" data-act="translate">翻译</button>
        <button class="btn btn-outline" data-act="clear">清除</button>
      </div>

      <div class="area">
        <div class="area-label">
          <span class="area-label-text">译文（中）</span>
          <div class="area-actions">
            <button class="btn-icon" data-act="copy-result" title="复制译文">📋</button>
            <button class="btn-icon" data-act="tts" title="朗读译文">🔊</button>
            <button class="btn-icon" data-act="save" title="收藏到生词本">⭐</button>
          </div>
        </div>
        <div class="result-box placeholder" data-el="result">翻译结果将显示在这里</div>
      </div>
    </div>
  </div>

  <!-- Vocabulary Panel (shared) -->
  <div class="card">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <div class="vocab-toggle" onclick="toggleVocab()">
        <span>📖 生词本</span>
        <span class="vocab-count" id="vocab-count">0</span>
        <span id="vocab-toggle-arrow" style="font-size:12px; color:var(--text-3);">▼</span>
      </div>
    </div>
    <div class="vocab-panel" id="vocab-panel">
      <div class="vocab-empty" id="vocab-empty">还没有收藏，翻译后点 ⭐ 收藏</div>
      <div id="vocab-list"></div>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/static/js/config.js"></script>
<script src="/static/js/tts-provider.js"></script>
<script src="/static/js/auth.js"></script>
<script>
// 未登录直接跳转 /login
if (!window.SpeakeasyAuth.getToken()) { location.replace('/login'); }
SpeakeasyAuth.requireAuth();
const USER_ID = (SpeakeasyAuth.getUser() || {}).id || '';
const MAX_LEN = 1000;
const ttsProvider = new ServerTTSProvider();
let vocabOpen = false;
let vocabItems = [];

// ── Pane wiring ──────────────────────────────────────────
class TranslatePane {
  constructor(card) {
    this.card      = card;
    this.direction = card.dataset.dir;
    this.inputEl   = card.querySelector('[data-el="input"]');
    this.countEl   = card.querySelector('[data-el="char-count"]');
    this.limitEl   = card.querySelector('[data-el="char-limit-msg"]');
    this.resultEl  = card.querySelector('[data-el="result"]');

    this.translateBtn = card.querySelector('[data-act="translate"]');
    this.clearBtn     = card.querySelector('[data-act="clear"]');
    this.copySrcBtn   = card.querySelector('[data-act="copy-src"]');
    this.copyResBtn   = card.querySelector('[data-act="copy-result"]');
    this.ttsBtn       = card.querySelector('[data-act="tts"]');
    this.saveBtn      = card.querySelector('[data-act="save"]');

    this.currentSource = '';
    this.currentResult = '';

    this.inputEl.addEventListener('input', () => this.onInput());
    this.inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        this.translate();
      }
    });
    this.translateBtn.addEventListener('click', () => this.translate());
    this.clearBtn.addEventListener('click', () => this.clear());
    this.copySrcBtn.addEventListener('click', () => this.copy(this.inputEl.value, '原文'));
    this.copyResBtn.addEventListener('click', () => this.copy(this.currentResult, '译文'));
    this.ttsBtn.addEventListener('click', () => this.speak());
    this.saveBtn.addEventListener('click', () => this.save());

    this.onInput();
  }

  onInput() {
    const len = this.inputEl.value.length;
    this.countEl.textContent = `${len} / ${MAX_LEN}`;
    const over = len > MAX_LEN;
    this.countEl.classList.toggle('over', over);
    this.limitEl.classList.toggle('show', over);
    this.inputEl.classList.toggle('over-limit', over);
    this.translateBtn.disabled = over;
  }

  clear() {
    this.inputEl.value = '';
    this.setResult('', 'placeholder');
    this.currentSource = '';
    this.currentResult = '';
    this.onInput();
  }

  async translate() {
    const text = this.inputEl.value.trim();
    if (!text) return;
    if (text.length > MAX_LEN) return;

    this.translateBtn.disabled = true;
    this.translateBtn.innerHTML = '<span class="spinner"></span>翻译中…';
    this.setResult('翻译中…', 'loading');

    try {
      const resp = await fetch('/translate/text', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text, direction: this.direction}),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${resp.status}`);
      }
      const data = await resp.json();
      this.currentSource = text;
      this.currentResult = data.translated_text;
      this.setResult(data.translated_text, 'ok');
    } catch (e) {
      this.setResult(`翻译失败：${e.message}`, 'error');
      this.currentResult = '';
    } finally {
      this.translateBtn.disabled = false;
      this.translateBtn.textContent = '翻译';
    }
  }

  setResult(text, mode) {
    this.resultEl.className = 'result-box';
    if (mode === 'placeholder' || !text) {
      this.resultEl.textContent = '翻译结果将显示在这里';
      this.resultEl.classList.add('placeholder');
      return;
    }
    this.resultEl.textContent = text;
    if (mode === 'error') this.resultEl.classList.add('error');
    else if (mode === 'loading') this.resultEl.classList.add('loading');
  }

  async copy(text, label) {
    if (!text || !text.trim()) {
      showToast(`${label}为空`, 'error');
      return;
    }
    try {
      await navigator.clipboard.writeText(text);
      showToast(`已复制${label}`, 'success');
    } catch (e) {
      showToast(`复制失败：${e.message}`, 'error');
    }
  }

  async speak() {
    if (!this.currentResult) return;
    this.ttsBtn.disabled = true;
    await ttsProvider.speak(
      this.currentResult,
      () => {},
      () => { this.ttsBtn.disabled = false; },
      () => { this.ttsBtn.disabled = false; showToast('朗读失败', 'error'); },
    );
  }

  async save() {
    if (!this.currentSource || !this.currentResult) return;
    this.saveBtn.disabled = true;
    try {
      const resp = await authFetch('/translate/vocabulary', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          source_text: this.currentSource,
          translated_text: this.currentResult,
          direction: this.direction,
        }),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${resp.status}`);
      }
      const item = await resp.json();
      vocabItems.unshift(item);
      updateVocabCount();
      renderVocabList();
      showToast('已收藏到生词本 ⭐', 'success');
    } catch (e) {
      showToast(`收藏失败：${e.message}`, 'error');
    } finally {
      this.saveBtn.disabled = false;
    }
  }
}

// ── Vocabulary ───────────────────────────────────────────
function toggleVocab() {
  vocabOpen = !vocabOpen;
  document.getElementById('vocab-panel').classList.toggle('show', vocabOpen);
  document.getElementById('vocab-toggle-arrow').textContent = vocabOpen ? '▲' : '▼';
  if (vocabOpen && vocabItems.length === 0) loadVocab();
}

async function loadVocab() {
  try {
    const resp = await authFetch(`/translate/vocabulary?limit=100`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    vocabItems = data.items;
    updateVocabCount();
    renderVocabList();
  } catch (e) {
    document.getElementById('vocab-empty').textContent = `加载失败：${e.message}`;
    document.getElementById('vocab-empty').style.display = 'block';
  }
}

function renderVocabList() {
  const listEl  = document.getElementById('vocab-list');
  const emptyEl = document.getElementById('vocab-empty');
  if (vocabItems.length === 0) {
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';
  listEl.innerHTML = vocabItems.map(v => `
    <div class="vocab-item" id="vitem-${v.id}">
      <div class="vocab-content">
        <div class="vocab-source">${escHtml(v.source_text)}</div>
        <div class="vocab-translated">${escHtml(v.translated_text)}</div>
        <div class="vocab-meta">${v.direction === 'zh2en' ? '中→英' : '英→中'} · ${formatDate(v.created_at)}</div>
      </div>
      <button class="vocab-del" onclick="deleteVocab(${v.id})" title="删除">🗑️</button>
    </div>
  `).join('');
}

async function deleteVocab(id) {
  try {
    const resp = await authFetch(`/translate/vocabulary/${id}`, {method:'DELETE'});
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    vocabItems = vocabItems.filter(v => v.id !== id);
    updateVocabCount();
    renderVocabList();
    showToast('已删除', 'success');
  } catch (e) {
    showToast(`删除失败：${e.message}`, 'error');
  }
}

function updateVocabCount() {
  document.getElementById('vocab-count').textContent = vocabItems.length;
}

// ── Utils ─────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); }, 2500);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function formatDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('zh-CN', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
  } catch { return iso; }
}

// ── Init ─────────────────────────────────────────────────
document.querySelectorAll('.card[data-dir]').forEach(card => new TranslatePane(card));
loadVocab();
</script>
</body>
</html>
