# LEGACY: Fly.io 部署配置，已被 docker-compose + Caddy 替代。计划在后续 PR 中移除。
app = "speakeasy-yes"
primary_region = "nrt"  # 东京（离中国最近）

[build]
  dockerfile = "Dockerfile"

[env]
  MODEL_PROVIDER = "volcengine"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# 持久化存储（SQLite + 音频缓存）
[mounts]
  source = "speakeasy_data"
  destination = "/data"
